<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRAINING OS</title>
<style>
html,body{margin:0;background:#101010;color:#f5f3ed;font-family:Arial,Helvetica,sans-serif}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
small{opacity:.65}
</style>
</head>
<body>
<div class="wrap"><div><b>TRAINING OS</b><br><small>Загрузка книги…</small></div></div>
<script>
(async()=>{
  try{
    const files=['book.part1.txt','book.part2.txt','book.part3.txt','book.part4.txt','book.part5.txt'];
    const parts=await Promise.all(files.map(name=>fetch(name,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(name);
      return r.text();
    })));
    const b64=parts.join('').replace(/\s+/g,'');
    const raw=atob(b64);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.querySelector('.wrap').innerHTML='<div><b>Не удалось открыть книгу</b><br><small>Обнови страницу или открой её в современном браузере.</small></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
